<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Cube Creative | Image Target</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #swiper-container {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 480px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
        }

        .swiper-slide img {
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <!-- A-Frame Scene -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" embedded color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"
            raycaster="far: 10000; objects: .clickable"></a-camera>

        <a-entity id="targetentity" targetentity mindar-image-target="targetIndex: 0"></a-entity>

    </a-scene>

    <!-- Swiper Container (Outside A-Frame) -->
    <div id="swiper-container">
        <div class="swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="assets/img1.png" /></div>
                <div class="swiper-slide"><img src="assets/img2.png" /></div>
                <div class="swiper-slide"><img src="assets/img3.png" /></div>
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>

    <script>
        AFRAME.registerComponent('targetentity', {
            init: function () {
                const swiperContainer = document.getElementById("swiper-container");

                // Initialize Swiper
                var swiper = new Swiper(".swiper", {
                    effect: "cube",
                    grabCursor: true,
                    cubeEffect: {
                        shadow: true,
                        slideShadows: true,
                        shadowOffset: 20,
                        shadowScale: 0.94,
                    },
                    pagination: {
                        el: ".swiper-pagination",
                    },
                    navigation: {
                        nextEl: ".swiper-button-next",
                        prevEl: ".swiper-button-prev",
                    },
                });

                this.el.addEventListener('targetFound', () => {
                    swiperContainer.style.display = "block";
                });

                this.el.addEventListener('targetLost', () => {
                    swiperContainer.style.display = "none";
                });
            }
        });
    </script>

</body>

</html>
