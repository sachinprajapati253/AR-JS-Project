<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Watch Try-On</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #overlay {
            width: 80%;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        #thumbnail-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            overflow-x: auto;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            scrollbar-width: none;
            /* Hide scrollbar */
        }

        #thumbnail-container::-webkit-scrollbar {
            display: none;
            /* Hide scrollbar on WebKit browsers */
        }

        .thumbnail {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, border 0.2s;
            border: 2px solid transparent;
        }

        .thumbnail:hover,
        .thumbnail.selected {
            transform: scale(1.1);
            border: 2px solid white;
        }
    </style>
</head>

<body>

    <div id="overlay">
        <h5>Try On Your Omega Watch</h5>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <img id="watch1" src="./assets/watch1.png">
            <img id="watch2" src="./assets/watch2.png">
            <img id="watch3" src="./assets/watch3.png">
            <img id="watch4" src="./assets/watch4.png">
            <img id="watch5" src="./assets/watch5.png">
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-image id="watchImage" src="#watch1" width="0.4" height="0.4" position="0 -0.25 0">
            </a-image>
        </a-entity>
    </a-scene>

    <!-- Thumbnail Slider -->
    <div id="thumbnail-container">
        <img class="thumbnail selected" src="./assets/watch1.png" onclick="changeWatch(1)">
        <img class="thumbnail" src="./assets/watch2.png" onclick="changeWatch(2)">
        <img class="thumbnail" src="./assets/watch3.png" onclick="changeWatch(3)">
        <img class="thumbnail" src="./assets/watch4.png" onclick="changeWatch(4)">
        <img class="thumbnail" src="./assets/watch5.png" onclick="changeWatch(5)">
    </div>

    <script>
        function changeWatch(index) {
            let watchImage = document.getElementById("watchImage");
            let imageSrc = ["#watch1", "#watch2", "#watch3", "#watch4", "#watch5"];
            watchImage.setAttribute("src", imageSrc[index - 1]);

            // Remove "selected" class from all thumbnails
            document.querySelectorAll('.thumbnail').forEach(thumb => thumb.classList.remove('selected'));

            // Add "selected" class to the clicked thumbnail
            document.querySelectorAll('.thumbnail')[index - 1].classList.add('selected');
        }
    </script>

</body>

</html>
