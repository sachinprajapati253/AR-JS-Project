<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Wrist Watch Try-On</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        .mainar {
            position: relative;
            width: 100vw;
            height: 680px;
            overflow: hidden;
        }

        canvas,
        video {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .title {
            position: absolute;
            top: 1%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 4px;
            border-radius: 10px;
            z-index: 10;
            width: 80%;
            margin: 10px;
            text-align: center;
        }

        #watch-picker {
            position: absolute;
            bottom: 3%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
            z-index: 10;
        }

        .watch-thumb {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, border 0.2s;
            border: 2px solid transparent;
        }

        .watch-thumb:hover,
        .watch-thumb.selected {
            transform: scale(1.1);
            border: 2px solid white;
        }
    </style>
</head>

<body>
    <div class="mainar">
        <div class="title">
            <h5>Lift your wrist to experience the virtual watch try-on</h5>
        </div>
        <video class="input_video" autoplay muted playsinline></video>
        <canvas class="output_canvas"></canvas>
        <div id="watch-picker">
            <img class="watch-thumb selected" src="./assets/watch1.png" data-index="0" onclick="setWatch(0)">
            <img class="watch-thumb" src="./assets/watch2.png" data-index="1" onclick="setWatch(1)">
            <img class="watch-thumb" src="./assets/watch3.png" data-index="2" onclick="setWatch(2)">
            <img class="watch-thumb" src="./assets/watch4.png" data-index="3" onclick="setWatch(3)">
            <img class="watch-thumb" src="./assets/watch5.png" data-index="4" onclick="setWatch(4)">
        </div>
    </div>

    <!-- Load MediaPipe Pose and Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        const video = document.querySelector(".input_video");
        const canvas = document.querySelector(".output_canvas");
        const ctx = canvas.getContext("2d");
        const watchThumbs = document.querySelectorAll(".watch-thumb");

        const watches = [];
        for (let i = 1; i <= 5; i++) {
            const img = new Image();
            img.src = `./assets/watch${i}.png`;
            watches.push(img);
        }

        let currentARWatch = watches[0];

        function setWatch(index) {
            currentARWatch = watches[index];
            document.querySelectorAll('.watch-thumb').forEach(thumb => thumb.classList.remove('selected'));
            document.querySelector(`.watch-thumb[data-index="${index}"]`).classList.add('selected');
        }

        let lastX = 0, lastY = 0;

        const pose = new Pose({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
            }
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            smoothSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults((results) => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;

                const wrist = landmarks[15];
                const elbow = landmarks[13];
                const shoulder = landmarks[11]; // Shoulder landmark

                const x = wrist.x * canvas.width;
                const y = wrist.y * canvas.height;
                const x2 = elbow.x * canvas.width;
                const y2 = elbow.y * canvas.height;
                // Add the visibility and position check here
                // if (wrist.visibility > 0.8 && elbow.visibility > 0.8 && wrist.y > shoulder.y) {
                const angle = Math.atan2(y2 - y, x2 - x);
                const dist = Math.hypot(x2 - x, y2 - y);

                // Smoother motion
                lastX = lastX * 0.9 + x * 0.1;
                lastY = lastY * 0.9 + y * 0.1;

                const size = dist * 0.6; // Smaller, more natural scale

                // Adjusting position to the back of the wrist, aligning better with the wrist's back position
                const offsetX = 0; // Fine-tune this if needed for wrist positioning
                const offsetY = 10; // Adjust to keep watch slightly above wrist

                ctx.save();
                ctx.translate(lastX + offsetX, lastY + offsetY);
                ctx.rotate(angle);
                ctx.drawImage(currentARWatch, -size / 2, -size / 2.5, size, size); // Slight upward shift
                ctx.restore();
                // }
            }
        });


        // Get video input devices
        navigator.mediaDevices.enumerateDevices()
            .then(devices => {
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                const backCam = videoDevices.find(d => d.label.toLowerCase().includes('back')) || videoDevices[0];

                return navigator.mediaDevices.getUserMedia({
                    video: {
                        deviceId: { exact: backCam.deviceId }
                    },
                    audio: false
                });
            })
            .then(stream => {
                video.srcObject = stream;
                video.play();

                // Process each frame manually
                const onFrame = async () => {
                    if (video.readyState === 4) {
                        await pose.send({ image: video });
                    }
                    requestAnimationFrame(onFrame);
                };
                onFrame();
            })
            .catch(err => console.error("Camera access error:", err));

    </script>
</body>

</html>
