<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wrist Watch Try-On</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        .mainar {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video,
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .title {
            position: absolute;
            top: 1%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 4px;
            border-radius: 10px;
            z-index: 10;
            width: 80%;
            max-width: 400px;
            margin: 10px;
            text-align: center;
        }

        .status {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 4px 8px;
            border-radius: 10px;
            z-index: 10;
            font-size: 16px;
            text-align: center;
        }

        #watch-picker {
            position: absolute;
            bottom: 3%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
            z-index: 10;
        }

        .watch-thumb {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, border 0.2s;
            border: 2px solid transparent;
        }

        .watch-thumb:hover,
        .watch-thumb.selected {
            transform: scale(1.1);
            border: 2px solid white;
        }
    </style>
</head>

<body>
    <div class="mainar">
        <div class="title">
            <h5>Lift your wrist to experience the virtual watch try-on</h5>
        </div>
        <div class="status" id="status-text">Recognising...</div>
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="watch-picker">
            <img class="watch-thumb selected" src="./assets/watch1.png" data-index="0" onclick="setWatch(0)"
                alt="Watch 1">
            <img class="watch-thumb" src="./assets/watch2.png" data-index="1" onclick="setWatch(1)" alt="Watch 2">
            <img class="watch-thumb" src="./assets/watch3.png" data-index="2" onclick="setWatch(2)" alt="Watch 3">
            <img class="watch-thumb" src="./assets/watch4.png" data-index="3" onclick="setWatch(3)" alt="Watch 4">
            <img class="watch-thumb" src="./assets/watch5.png" data-index="4" onclick="setWatch(4)" alt="Watch 5">
        </div>
    </div>

    <!-- Load MediaPipe Hands and Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const statusText = document.getElementById("status-text");

        const watches = Array.from({ length: 5 }, (_, i) => {
            const img = new Image();
            img.src = `./assets/watch${i + 1}.png`;
            return img;
        });
        let currentARWatch = watches[0];

        function setWatch(index) {
            currentARWatch = watches[index];
            document.querySelectorAll('.watch-thumb').forEach(thumb => thumb.classList.remove('selected'));
            document.querySelector(`.watch-thumb[data-index="${index}"]`).classList.add('selected');
        }

        // Function to draw clock hands on the watch
        function drawClockHands(ctx, size) {
            // Draw clock hands
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const hourAngle = (hours * 30) + (minutes / 2);
            const minuteAngle = (minutes * 6) + (seconds / 10);
            const secondAngle = seconds * 6;

            // Hour hand
            ctx.save();
            ctx.rotate(hourAngle * Math.PI / 180);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -size * 0.15); // Shorter hour hand
            ctx.lineWidth = 4;
            ctx.strokeStyle = "black";
            ctx.stroke();
            ctx.restore();

            // Minute hand
            ctx.save();
            ctx.rotate(minuteAngle * Math.PI / 180);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -size * 0.18); // Medium minute hand
            ctx.lineWidth = 3;
            ctx.strokeStyle = "black";
            ctx.stroke();
            ctx.restore();

            // Second hand
            ctx.save();
            ctx.rotate(secondAngle * Math.PI / 180);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -size * 0.21); // Longer second hand
            ctx.lineWidth = 1;
            ctx.strokeStyle = "red";
            ctx.stroke();
            ctx.restore();

            // Center dot
            ctx.beginPath();
            ctx.arc(0, 0, 3, 0, 2 * Math.PI);
            ctx.fillStyle = "black";
            ctx.fill();
        }

        // Smoothing variables for wrist position and angle
        let lastX = 0, lastY = 0, lastAngle = 0;

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            // Adjust canvas size to match video aspect ratio
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            const aspectRatio = videoWidth / videoHeight;
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            const containerAspectRatio = containerWidth / containerHeight;

            let canvasWidth, canvasHeight;
            if (containerAspectRatio > aspectRatio) {
                canvasHeight = containerHeight;
                canvasWidth = canvasHeight * aspectRatio;
            } else {
                canvasWidth = containerWidth;
                canvasHeight = canvasWidth / aspectRatio;
            }
            canvas.width = Math.round(canvasWidth);
            canvas.height = Math.round(canvasHeight);

            // Clear and draw video frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Select the hand with the most visible wrist
                let bestHand = null;
                let bestWristConfidence = 0;
                for (const landmarks of results.multiHandLandmarks) {
                    const wrist = landmarks[0]; // Wrist landmark
                    if (wrist.z < bestWristConfidence) { // Lower z indicates higher confidence
                        bestHand = landmarks;
                        bestWristConfidence = wrist.z;
                    }
                }

                if (bestHand) {
                    statusText.textContent = "Wrist Detected!";
                    const wrist = bestHand[0]; // Wrist
                    const mcp = bestHand[9]; // Middle finger MCP (for orientation)

                    const x = wrist.x * canvas.width;
                    const y = wrist.y * canvas.height;
                    const x2 = mcp.x * canvas.width;
                    const y2 = mcp.y * canvas.height;

                    // Smooth position
                    lastX = lastX * 0.9 + x * 0.1;
                    lastY = lastY * 0.9 + y * 0.1;

                    // Calculate angle and size
                    const angle = Math.atan2(y2 - y, x2 - x);
                    lastAngle = lastAngle * 0.9 + angle * 0.1;
                    const dist = Math.hypot(x2 - x, y2 - y);
                    const watchSize = dist * 1; // Adjust multiplier for watch size

                    // Draw watch
                    if (currentARWatch.complete) {
                        ctx.save();
                        ctx.translate(lastX, lastY);
                        ctx.rotate(lastAngle);
                        ctx.drawImage(currentARWatch, -watchSize / 2, -watchSize / 2, watchSize, watchSize);
                        // Draw clock hands on top of the watch
                        drawClockHands(ctx, watchSize);
                        ctx.restore();
                    }

                    // Debugging dot at wrist
                    // ctx.beginPath();
                    // ctx.arc(x, y, 5, 0, 2 * Math.PI);
                    // ctx.fillStyle = 'red';
                    // ctx.fill();

                } else {
                    statusText.textContent = "Scanning...";
                }
            } else {
                statusText.textContent = "Scanning...";
            }
        });

        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
            width: 640,
            height: 480,
            facingMode: 'environment' // Use back camera
        });

        camera.start();

        window.addEventListener('resize', () => {
            // Update canvas size on resize
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            const aspectRatio = videoWidth / videoHeight;
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            const containerAspectRatio = containerWidth / containerHeight;

            let canvasWidth, canvasHeight;
            if (containerAspectRatio > aspectRatio) {
                canvasHeight = containerHeight;
                canvasWidth = canvasHeight * aspectRatio;
            } else {
                canvasWidth = containerWidth;
                canvasHeight = canvasWidth / aspectRatio;
            }
            canvas.width = Math.round(canvasWidth);
            canvas.height = Math.round(canvasHeight);
        });
    </script>
</body>

</html>
